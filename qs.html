<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> Questions | Forecast With Friends </title>
  <link rel="stylesheet" href="style.css" />

  <style>
    :root {
      --brand-purple: #7c5cbf;
      --purple-dark: #6849a8;
      --text: #000000;
      --subtle: #64748b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 1rem;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background: #fff;
      display: flex;
      justify-content: center;
    }

    .page {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      padding: 1rem;
      text-align: center;
    }

    h1 {
      margin-bottom: 0.4rem;
    }

    #question-progress {
      color: var(--subtle);
      font-weight: 600;
      margin-bottom: 1.5rem;
    }

    #question-card {
      width: min(92vw, 450px);
      min-height: 500px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      border: 2px solid var(--brand-purple);
      border-radius: 16px;
    
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    #question-card {
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    
    #question-card.card-out {
      opacity: 0;
      transform: translateX(-24px);
    }
    
    #question-card.card-in {
      opacity: 0;
      transform: translateX(24px);
    }
    
    .completion-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }
    
    .completion-button {
      padding: 0.8rem 1.1rem;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    
    #edit-answers {
      background: #fff;
      color: var(--brand-purple);
      border: 2px solid var(--brand-purple);
    }
    
    #view-score {
      background: var(--brand-purple);
      color: #fff;
      border: 2px solid var(--brand-purple);
      text-decoration: none;
    }

    #question-text {
      margin: 0 0 1.5rem;
      font-size: 1.3rem;
      line-height: 1.4;
    }

    #answer-area {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }

    #answer-area .answer-option {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 2px solid var(--brand-purple);
      border-radius: 10px;
      background: #fff;
      color: var(--brand-purple);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    
    #answer-area .answer-option:hover {
      background: #f7f3ff;
      border-color: var(--brand-purple);
      color: var(--brand-purple);
    }
    
    #answer-area .answer-option.selected,
    #answer-area .answer-option.selected:hover {
      background: var(--brand-purple);
      border-color: var(--brand-purple);
      color: #fff;
    }

    .numeric-answer-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 1.3rem;
    }
    
    .numeric-answer {
      width: 150px;
      padding: 0.8rem 0.8rem;
      border: 2px solid var(--brand-purple);
      border-radius: 10px;
      font: inherit;
      font-size: 1.1rem;
      text-align: center;
    }
    
    .numeric-answer:focus {
      outline: none;
      border-color: var(--purple-dark);
    }

    #save-answer {
      align-self: center;
      width: 140px;
      margin-top: 1.25rem;
      padding: 0.85rem 1.4rem;
      border: 0;
      border-radius: 10px;
      background: var(--brand-purple);
      color: #fff;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
    }
    
    #save-answer:hover:not(:disabled) {
      background: var(--purple-dark);
      color: #fff;
    }

    #save-answer:disabled,
    #save-answer:disabled:hover {
      background: var(--brand-purple);
      color: #fff;
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    #question-status {
      min-height: 1.2rem;
      margin-top: 0.8rem;
      color: var(--subtle);
    }

    #how-to-play {
      margin: 0.5rem auto 1rem;
      padding: 0.55rem 1rem;
      border: 2px solid var(--brand-purple);
      border-radius: 10px;
      background: #fff;
      color: var(--brand-purple);
      font-weight: 700;
      cursor: pointer;
    }
    
    .questions-date {
      margin-top: 0.5rem;
      margin-bottom: 2rem;
      font-size: 1.3rem;
      font-weight: 700;
    }
    
    .date-info {
      position: relative;
      display: inline-flex;
      align-items: center;
      margin-left: 0.25rem;
      font-size: 1rem;
      font-weight: 400;
      cursor: help;
    }
    
    .date-tooltip {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 8px);
      transform: translateX(-50%);
    
      width: max-content;
      max-width: 220px;
      padding: 0.5rem 0.7rem;
    
      background: #222;
      color: #fff;
      border-radius: 7px;
    
      font-size: 0.8rem;
      font-weight: 400;
      line-height: 1.3;
    
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    
      transition: opacity 0.15s ease;
    }
    
    .date-info:hover .date-tooltip,
    .date-info:focus .date-tooltip {
      opacity: 1;
      visibility: visible;
    }
  
  </style>
</head>

<body>
  <main class="page">

    <h1> My Questions </h1>    
    <button id="how-to-play" type="button">
      How To Play
    </button>
    
    <div class="questions-date">
      <strong id="questions-date-label"> 15 Sept 2026 </strong>
      <span class="date-info" tabindex="0" aria-label="Date information">
        ⓘ
        <span class="date-tooltip">
          Dates shown in Pacific Time (PT)
        </span>
      </span>
    </div>

    <section id="question-card">
      <div id="question-progress">
        1 / 2
      </div>
      
      <h2 id="question-text">
        How many coins will I earn today?
      </h2>

      <div id="answer-area">
      </div>

      <button id="save-answer" type="button" disabled>
        Save
      </button>

      <div id="question-status" aria-live="polite"></div>
    </section>

  </main>

  <script type="module" src="qs.js"></script>
</body>
</html>
